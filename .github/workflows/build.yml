name: Build CLOACHY APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.zip'
      - '**.md'
      - 'screenshots/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-cloachy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Pastikan Android SDK tersedia
        run: |
          set -e
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "SDK tidak ditemukan, gunakan sdkmanager bawaan..."
            export ANDROID_HOME="$HOME/android-sdk"
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          (yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1) || true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug + Release APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cloachy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cloachy-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
